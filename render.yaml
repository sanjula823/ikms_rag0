services:
  - type: web
    name: ikms-rag-demo
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend/src && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEY
        value: sk-placeholder
      - key: PINECONE_API_KEY
        value: pcsk-placeholder
      - key: PINECONE_INDEX
        value: ikmsrag
      - key: PINECONE_ENV
        value: us-east-1
